<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shifty Bits</title>
<style>
  html, body { margin: 0; height: 100%; background: #07081a; overflow: hidden; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #07081a; }
  canvas { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; outline: none; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 14px/1.4 ui-monospace, Consolas, monospace; color: #ffd27a; background: rgba(6, 8, 20, 0.85);
    border: 1px solid #96784a; padding: 6px 14px; pointer-events: none; transition: opacity 0.6s;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="960" height="720" tabindex="0"></canvas></div>
<div id="hint">Press any key or click to start the music</div>
<script type="module" src="shiftybits.js"></script>
</body>
</html>
