# Builds Shifty Bits for Windows, Linux and the browser and publishes the three as a GitHub release.
#
# The version is `GameVersion` in src/version.csh. A release is made in one of two ways:
#   - pushing a tag `v<version>`: git tag v1.0 && git push origin v1.0
#   - starting the workflow by hand (Actions > Release > Run workflow) with "publish" checked: it creates the tag
#     `v<version>` on the commit it builds, and the release.
# Started by hand without "publish", it only builds and keeps the packages as artifacts of the run, to try a build.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (creates the tag v<version>)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # the CShift release the game is built with (https://github.com/Robert-Schneckenhaus/CShift/releases)
  CSHIFT_VERSION: "0.32"
  # the MiniFB commit whose headers are in include/ (Linux builds MiniFB from its sources, see tools/build-linux.sh)
  MINIFB_COMMIT: 3cece1f72d1e43742051d114d36bded76e1327be

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version and check it against the tag
        id: version
        run: |
          version=$(sed -n 's/^const string GameVersion = "\(.*\)";/\1/p' src/version.csh)
          if [ -z "$version" ]; then
            echo "::error::GameVersion not found in src/version.csh"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match GameVersion $version in src/version.csh"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      # the folder in the archive carries the version; the archive itself has a fixed name, so that the README can
      # link to releases/latest/download/<name>
      PACKAGE: ShiftyBits-${{ needs.version.outputs.version }}-windows-x64
      ARCHIVE: ShiftyBits-windows-x64
    steps:
      - uses: actions/checkout@v7

      - name: Install the CShift compiler
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\cshift.zip"
          Invoke-WebRequest "https://github.com/Robert-Schneckenhaus/CShift/releases/download/v$env:CSHIFT_VERSION/cshift-$env:CSHIFT_VERSION-windows-x64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\cshift-$env:CSHIFT_VERSION-windows-x64" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build
        shell: pwsh
        run: |
          cshiftc --version
          cshiftc build .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # the test mode renders an image without a window: the program starts and draws
      - name: Test
        shell: pwsh
        run: |
          foreach ($mode in 'intro', 'pointer') {
            $p = Start-Process bin\ShiftyBits.exe -ArgumentList '--shot', "$mode.png", $mode -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "--shot $mode failed with $($p.ExitCode)" }
            if (-not (Test-Path "$mode.png")) { throw "--shot $mode wrote no image" }
          }

      # pictures of the Windows version: the screens of the test mode, then the real window, photographed from the
      # desktop of the runner (that part may fail where the runner has no desktop, which does not stop the release)
      - name: Screenshots
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory shots | Out-Null
          foreach ($mode in 'intro', 'menu', 'play', 'alternate', 'awards', 'over') {
            Start-Process bin\ShiftyBits.exe -ArgumentList '--shot', "shots\$mode.png", $mode -Wait -NoNewWindow
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Save-Screen([string]$name) {
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("shots\$name.png")
          }
          $game = Start-Process bin\ShiftyBits.exe -PassThru
          Start-Sleep -Seconds 8
          Save-Screen 'window-intro'
          $shell = New-Object -ComObject WScript.Shell
          $null = $shell.AppActivate($game.Id)
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          Start-Sleep -Seconds 2
          Save-Screen 'window-menu'
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 4
          Save-Screen 'window-game'
          Stop-Process -Id $game.Id -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory "$env:PACKAGE" | Out-Null
          Copy-Item bin\ShiftyBits.exe, README.md "$env:PACKAGE\"
          Copy-Item include\LICENSE-MiniFB "$env:PACKAGE\LICENSE-MiniFB.txt"
          Compress-Archive "$env:PACKAGE" "$env:ARCHIVE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: ${{ env.ARCHIVE }}.zip

  linux:
    needs: version
    # the oldest supported Ubuntu: the program then runs on every distribution with that glibc or a newer one
    runs-on: ubuntu-22.04
    env:
      PACKAGE: ShiftyBits-${{ needs.version.outputs.version }}-linux-x64
      ARCHIVE: ShiftyBits-linux-x64
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libffi8 libedit2 libz3-4 zlib1g libzstd1 libxml2 \
            libx11-dev libxrandr-dev libxkbcommon-dev libgl-dev libasound2-dev

      - name: Install the CShift compiler
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cshift.tar.xz" \
            "https://github.com/Robert-Schneckenhaus/CShift/releases/download/v$CSHIFT_VERSION/cshift-$CSHIFT_VERSION-linux-x64.tar.xz"
          tar -xf "$RUNNER_TEMP/cshift.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cshift-$CSHIFT_VERSION-linux-x64" >> "$GITHUB_PATH"

      - name: Build
        run: |
          grep -q "MINIFB_COMMIT=$MINIFB_COMMIT" tools/build-linux.sh
          cshiftc --version
          tools/build-linux.sh

      - name: Test
        run: |
          bin/shiftybits --shot intro.png intro
          bin/shiftybits --shot pointer.png pointer
          test -f intro.png
          ldd bin/shiftybits

      - name: Package
        run: |
          mkdir "$PACKAGE"
          cp bin/shiftybits README.md "$PACKAGE/"
          cp include/LICENSE-MiniFB "$PACKAGE/LICENSE-MiniFB.txt"
          tar -czf "$ARCHIVE.tar.gz" "$PACKAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: ${{ env.ARCHIVE }}.tar.gz

  web:
    needs: version
    runs-on: ubuntu-latest
    env:
      ARCHIVE: ShiftyBits-web
    steps:
      - uses: actions/checkout@v7

      - name: Install the CShift compiler
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cshift.tar.xz" \
            "https://github.com/Robert-Schneckenhaus/CShift/releases/download/v$CSHIFT_VERSION/cshift-$CSHIFT_VERSION-linux-x64.tar.xz"
          tar -xf "$RUNNER_TEMP/cshift.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cshift-$CSHIFT_VERSION-linux-x64" >> "$GITHUB_PATH"

      - name: Build and package
        run: |
          cshiftc build web
          # the files at the top of the archive, with index.html there: what itch.io and other hosts of HTML games expect
          zip -j "$ARCHIVE.zip" web/index.html web/shiftybits.js web/shiftybits.wasm web/serve.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: package-web
          path: ${{ env.ARCHIVE }}.zip

  release:
    if: github.ref_type == 'tag' || inputs.publish
    needs: [version, windows, linux, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: packages
          pattern: package-*
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the section of CHANGELOG.md for this version, if it has one
          awk -v v="## $VERSION" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > changes.md
          cat > notes.md <<EOF
          Shifty Bits $VERSION, the bit shifting puzzle game.

          $(cat changes.md)

          | Package | |
          |---|---|
          | \`ShiftyBits-windows-x64.zip\` | Windows 10/11 (64 bit): unpack and start \`ShiftyBits.exe\` |
          | \`ShiftyBits-linux-x64.tar.gz\` | Linux (64 bit, glibc 2.35 or newer, e.g. Ubuntu 22.04+, Debian 12+): unpack and start \`shiftybits\`. Needs X11 (or XWayland), OpenGL and ALSA, which a desktop has; copying and pasting the seed uses \`wl-copy\`, \`xclip\` or \`xsel\` if one is installed |
          | \`ShiftyBits-web.zip\` | The browser version to host yourself (\`node serve.mjs\` serves it locally) |

          Or play it in the browser: https://pyrdacor.github.io/Shifty-Bits/

          The best values, the settings and the screenshots are kept in the folder the game is started in.
          EOF
          # for a pushed tag that tag; started by hand, the tag of the version is created on the commit that was built.
          # A release of this version that exists already gets the packages added (or replaced) and its notes renewed.
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" packages/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Shifty Bits $VERSION" --notes-file notes.md
          fi
